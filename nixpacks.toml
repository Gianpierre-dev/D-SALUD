# Personalización del BUILD para Railway / Nixpacks.
#
# IMPORTANTE: NO se define [phases.setup]. El provider de PHP de Nixpacks
# detecta Laravel y arma el setup completo (php + composer + node + nginx +
# php-fpm). Si redefiniéramos [phases.setup] reemplazaríamos ese setup y
# dejaríamos a composer fuera del PATH (build roto).
#
# Gestor de paquetes JS: npm. Se usa npm (y no pnpm) porque pnpm + composer
# colisionan en el nix-env de Nixpacks (ambos traen un archivo LICENSE en la
# raíz del store y nix-env aborta). El package-lock.json se regeneró para
# incluir recharts; el pnpm-lock.yaml se ignora en .railwayignore.
#
# El servicio web se sirve con nginx + php-fpm (no `php artisan serve`); el
# startCommand vive en railway.json. Estas variables las consume el template
# de nginx de Nixpacks en el arranque: root del sitio = /app/public y activar
# el bloque de routing de Laravel. Definirlas aquí mantiene el deploy
# reproducible desde el repo (sin setear variables a mano en Railway).

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
IS_LARAVEL = "1"
# Vite lee esta variable en tiempo de BUILD (import.meta.env.VITE_APP_NAME);
# sin ella el título de las pestañas cae al fallback "Laravel".
VITE_APP_NAME = "D'Salud"

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build",
]
